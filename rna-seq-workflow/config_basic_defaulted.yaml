## =====================================================================
## rna-seq 工作流默认配置
## 项目运行时可用 --configfile user.yaml 覆盖其中任意键（命令行优先）。
## /path/to/... 为路径占位符，首次运行前必须替换为集群上的真实路径。
## =====================================================================

## ---- 样本与分组 ----
SampleListFile: "sample_info.csv"
control_group: "control"
threads: 12

## ---- 差异表达阈值 ----
## FoldChange 为倍数阈值：log2FoldChange 绝对值 > 1 即 2 倍
FoldChange: "2"
padj: "0.05"

## ---- 参考基因组（示例为水稻 osa，hsa 人类项目请替换为 GRCh38/GENCODE 路径）----
species: "osa"
bed: "/path/to/reference/osa/Oryza_sativa.IRGSP-1.0.56.Chr.bed"
genome: "/path/to/reference/osa/genome.fa"
gtf: "/path/to/reference/osa/annotation.gtf"

## ---- 功能富集资源 ----
## annotation_tsv: 基因 id 功能注释表（enrich 与 DEGcompare 的 DEGs 注释用）
## orgdb_tarball:  osa 本地 OrgDb 安装包（R 包 org.Osativa.eg.db_*.tar.gz）；species=hsa 时忽略
annotation_tsv: "/path/to/reference/osa/annotation_full.tsv"
orgdb_tarball: "/path/to/reference/osa/org.Osativa.eg.db_0.1.tar.gz"
