## =====================================================================
## Example project config — a project-level override example, passed directly via:
##   bash run.sh -P <workdir> -c <repo path>/example/config.yaml
## Config chain: repository config/config.yaml -> this file -> config.local.yaml
## (auto-merged; later files win). This file lists only commonly overridden
## project keys; anything not listed keeps the repository default.
## For all keys and defaults see config/config.yaml; for the annotated optional
## override template see config/config.template.yaml.
## =====================================================================

# ---------- Sample table ----------
# Relative paths resolve against the working directory (the -P directory): copy
# samples.csv from this directory into the working directory (or use absolute
# paths). For the 6-column schema and row-level validation rules see
# config/samples.csv.
grouplist: "samples.csv"

# ---------- Species and output ----------
species: "osa"                  # osa | hsa; presets in config/species.yaml
results_dir: "results"          # root for all run outputs; raw inputs 1.rawdata/ stay at the working-directory root

# ---------- Reference genome (must be replaced with real cluster paths before
#            running; when switching species update genome_size as well) ----------
genome_fa: "/path/to/genome.fasta"   # bowtie2 index input
gtf: "/path/to/annotation.gtf"       # for peak annotation
bed: "/path/to/genes.bed"            # for deeptools gene-region signal
chromsize: "/path/to/chrom.sizes"    # for bigWig generation
genome_size: "3.7e8"                 # MACS2 effective genome size (rice IRGSP-1.0 ~3.7e8)

# ---------- Resources ----------
threads: 8                           # global thread cap

# ---------- Deduplication (per assay; CUT&Tag literature recommends keeping
#            duplicates, Kaya-Okur et al. 2019) ----------
dedup:
  chip: true
  cuttag: false
  atac: true
  faire: true

# ---------- QC switches ----------
qc:
  nsc_rsc: false    # SPP cross-correlation NSC/RSC (slow; off by default)
  frip: true        # FRiP (fraction of reads in peaks, an ENCODE metric)
  deeptools: true   # correlation/PCA/fingerprints/fragment sizes/gene-region signal
