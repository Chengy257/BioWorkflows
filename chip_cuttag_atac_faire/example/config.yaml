## =====================================================================
## 示例项目配置 —— 项目级覆盖示例，可直接传入：
##   bash run.sh -P <工作目录> -c <仓库路径>/example/config.yaml
## 配置链：仓库 config/config.yaml → 本文件 → config.local.yaml（自动叠加，
## 后者优先）。本文件只列项目常用覆盖键，未列出的键沿用仓库默认值；
## 全部键与默认值见 config/config.yaml，可选覆盖模板见 config/config.template.yaml。
## =====================================================================

# ---------- 样本表 ----------
# 相对路径相对工作目录（-P 指向的目录）解析：把本目录的 samples.csv 复制到
# 工作目录（或改成绝对路径）。6 列 schema 与逐行校验规则见 config/samples.csv。
grouplist: "samples.csv"

# ---------- 参考基因组（运行前必须替换为集群真实路径；换物种同步改 genome_size） ----------
genome_fa: "/path/to/genome.fasta"   # bowtie2 建索引输入
gtf: "/path/to/annotation.gtf"       # 峰注释用
bed: "/path/to/genes.bed"            # deeptools 基因区信号用
chromsize: "/path/to/chrom.sizes"    # bigWig 生成用
genome_size: "3.7e8"                 # MACS2 有效基因组大小（水稻 IRGSP-1.0 约 3.7e8）

# ---------- 资源 ----------
threads: 8                           # 单任务线程数

# ---------- 去重（按 assay；CUT&Tag 文献推荐不去重，Kaya-Okur et al. 2019） ----------
dedup:
  chip: true
  cuttag: false
  atac: true
  faire: true

# ---------- QC 开关 ----------
qc:
  nsc_rsc: false    # SPP 交叉相关 NSC/RSC（较耗时，默认关）
  frip: true        # FRiP（reads in peaks 占比，ENCODE 指标）
  deeptools: true   # 相关性/PCA/指纹/片段长/基因区信号
