# Unified software/runtime configuration.
# Copy it into the project directory as software.yaml and override only the
# entries that differ.

environment:
  type: system                  # system | conda
  conda_prefix: ""              # recommended on HPC, e.g. /share/conda/envs/chip-cuttag-atac-faire
  conda_name: ""                # alternative to conda_prefix
  strict: true

r:
  rscript: "Rscript"            # command name or absolute path
  version: ""                   # optional, e.g. "4.3"
  version_check: major_minor    # major_minor | exact | warn | off
  lib_paths: []                 # optional R library dirs (fill in to reuse existing server libraries such as ChIPseeker)
  lib_mode: prepend             # prepend | append | replace
  package_sources: {}           # optional package name -> local tarball path (for install hints only)

# Regular tools are resolved from the main environment/PATH automatically;
# override only entries that differ.
tools:
  trim_galore: "trim_galore"
  bowtie2: "bowtie2"
  samtools: "samtools"
  picard: "picard"              # a full picard.jar path also works
  macs2: "macs2"
  bedtools: "bedtools"
  deeptools: "bamCoverage"     # the deeptools suite is represented by the bamCoverage binary (the package ships no "deeptools" executable)
  spp: "run_spp.R"              # phantompeakqualtools' R entry point (command name inside the bioconda package)

paths:
  # idr (irreproducible discovery rate) is a python2 tool deliberately kept
  # OUT of the conda template; needed only when peak.replicate.enabled is
  # true. Install separately, e.g.:
  #   conda create -n idr -c bioconda idr=2.0.4
  # then point this entry at the binary (absolute path) or put `idr` on PATH.
  idr: "idr"
  # HOMER motif enrichment (needed only when motif.enabled is true): the
  # findMotifsGenome.pl entry point of an external HOMER distribution
  # (configureHomer); command name or absolute path. The HOMER genome data
  # (motif.homer_genome) is installed separately via configureHomer.
  homer_findmotifs: "findMotifsGenome.pl"

databases: {}
