# =====================================================================
# Config template — copy to config.local.yaml in your working directory
# and override what differs (that file stays out of version control; run.sh
# auto-merges: repository config/config.yaml + working-dir config.local.yaml).
# Can also be copied wholesale as a project-specific config. Every key is
# optional; unset keys fall back to the defaults.
# =====================================================================

# ---------- Species and output ----------
species: "osa"                  # osa | hsa; presets (reference paths, genome size) in config/species.yaml
results_dir: "results"          # derived artifacts root; raw inputs (1.rawdata/) stay at the working-directory root

# ---------- Reference genome (override the species preset when needed) ----------
# genome_fa: "/path/to/genome.fasta"   # bowtie2 index input
# gtf: "/path/to/annotation.gtf"       # peak annotation
# bed: "/path/to/genes.bed"            # deeptools gene-region signal
# chromsize: "/path/to/chrom.sizes"    # bigWig generation
# genome_size: "3.7e8"                 # MACS2 effective genome size (rice example)

# ---------- Sample table and global resources ----------
grouplist: "samples.csv"        # sample table (copy into the working directory; schema in config/samples.csv)
threads: 12                     # legacy global thread cap; per-rule requests in config/resources.yaml

# ---------- Quality trimming (trim_galore) ----------
trim:
  quality: 25        # -q: terminal low-quality base threshold
  stringency: 3      # minimum adapter overlap (bp)
  error_rate: 0.1    # -e: max adapter mismatch rate
  extra: ""          # extra arguments

# ---------- Alignment ----------
bowtie2_extra: "--end-to-end --very-sensitive --no-mixed --no-discordant --phred33 -I 10 -X 700"
min_mapq: 30   # MAPQ filter threshold (ENCODE standard)

# ---------- Deduplication (picard per assay) ----------
dedup:
  chip: true
  cuttag: false   # CUT&Tag literature recommends keeping duplicates (Kaya-Okur et al. 2019)
  atac: true
  faire: true

# ---------- Peak calling ----------
peak:
  keepdup: all        # MACS2 keeps all duplicates (dedup is decided upstream)
  qvalue: 0.05        # narrow peak q-value
  broad_cutoff: 0.05  # broad peak cutoff
  atac:               # ATAC/FAIRE peak-calling mode
    mode: bampe       # bampe (ENCODE ATAC v2 default) | shifted (classic Tn5 offset recipe)
    shift: -100       # shifted mode only
    extsize: 200      # shifted mode only

# ---------- Annotation and signal windows ----------
region_flank: 3000   # peak-annotation flank and deeptools window length (bp)

# ---------- QC switches ----------
qc:
  nsc_rsc: false
  frip: true
  deeptools: true
