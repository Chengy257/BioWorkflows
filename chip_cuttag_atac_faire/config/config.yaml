# =====================================================================
# chip_cuttag_atac_faire main analysis config (repository default).
# Copy to a project directory and adjust; run.sh injects it via CHIP_CONFIG:
#   bash run.sh -P /path/to/workdir -c /path/to/config.yaml
# Layering: config/resources.yaml (scheduler resources) -> this file ->
# config.local.yaml in the working directory (auto-merged by run.sh).
# This file doubles as the default for --lint and repository examples.
# =====================================================================

## ---- Species and output ----
species: "osa"                  # osa | hsa; presets live in config/species.yaml
results_dir: "results"          # all derived artifacts go here; raw inputs stay at the working-directory root

## ---- Sample table and global resources ----
# Raw FASTQ lookup (trim_adapter): files are resolved per sample_id from
# 1.rawdata/ as {id}_1.fastq.gz + {id}_2.fastq.gz, {id}_1.fq.gz + {id}_2.fq.gz,
# {id}_R1.fastq.gz + {id}_R2.fastq.gz, or {id}_R1.fq.gz + {id}_R2.fq.gz
# (first complete pair wins; paired-end only).
grouplist: "config/samples.csv" # sample table; defaults to the repository template (parseable for lint/docs), override in the working directory
threads: 12                     # legacy global thread cap for every rule; per-rule values live in config/resources.yaml

## ---- Reference genome (unset keys fall back to the species preset in
##      config/species.yaml; uncomment to override with explicit paths) ----
# genome_fa: "/path/to/genome.fasta"        # bowtie2 index input
# gtf: "/path/to/annotation.gtf"            # peak annotation
# bed: "/path/to/genes.bed"                 # deeptools gene-region signal
# chromsize: "/path/to/chrom.sizes"         # bigWig generation
# genome_size: "3.7e8"                      # MACS2 effective genome size

# ---------- Quality trimming (trim_galore) ----------
trim:
  quality: 25        # -q: terminal low-quality base threshold
  stringency: 3      # minimum adapter overlap (bp)
  error_rate: 0.1    # -e: max adapter mismatch rate
  extra: ""          # extra arguments, e.g. "--clip_r1 5 --clip_r2 5"

# ---------- Alignment ----------
bowtie2_extra: "--end-to-end --very-sensitive --no-mixed --no-discordant --phred33 -I 10 -X 700"
min_mapq: 30   # MAPQ filter threshold (ENCODE standard; the legacy pipeline used 5)

# ---------- Deduplication (picard per assay) ----------
# CUT&Tag literature recommends keeping PCR duplicates (Kaya-Okur et al. 2019)
dedup:
  chip: true
  cuttag: false
  atac: true
  faire: true

# ---------- Peak calling (tune per project as needed) ----------
peak:
  keepdup: all           # duplicate handling is decided upstream; MACS2 keeps all
  qvalue: 0.05           # narrow peak q-value cutoff
  broad_cutoff: 0.05     # broad peak cutoff
  atac:
    mode: bampe          # bampe = ENCODE ATAC v2 recipe (pile up real fragment lengths, default);
                         # shifted = classic Tn5 offset recipe (-f BAM --nomodel --shift -100 --extsize 200)
    shift: -100          # effective in shifted mode only
    extsize: 200         # effective in shifted mode only

# ---------- Annotation and signal windows ----------
region_flank: 3000   # peak-annotation flank and deeptools signal window up/downstream (bp)

# ---------- QC switches ----------
qc:
  nsc_rsc: false     # SPP cross-correlation NSC/RSC (slow; needs phantompeakqualtools)
  frip: true         # FRiP (fraction of reads in peaks, an ENCODE metric)
  deeptools: true    # correlation/PCA/fingerprints/fragment sizes/gene-region profiles

# Scheduler resources (per rule) now live in config/resources.yaml.
