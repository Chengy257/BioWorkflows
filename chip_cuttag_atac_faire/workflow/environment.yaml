# All-in-one environment template for fresh servers.
# This file is NOT consumed automatically by Snakemake; create the environment
# explicitly, e.g.: mamba env create -f workflow/environment.yaml
name: chip-cuttag-atac-faire
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # python is unpinned: macs2 2.2.7.1 solves against python 3.10 (WSL real-run
  # finding 2026-09-09; a 3.11 pin makes the solve fail)
  - git
  - pyyaml
  - snakemake-minimal=7.32.4
  # Upstream QC and trimming
  - fastqc=0.12.1
  - trim-galore=0.6.10
  - multiqc=1.14
  # Alignment
  - bowtie2=2.5.1
  - samtools=1.17
  # Dedup / peak calling / signal tracks
  - picard=3.0.0
  - macs2=2.2.7.1
  # bedtools/ucsc are unpinned: the 2.31.0/482 builds lost their xz providers
  # in current repodata (2026-09-09 solve round)
  - bedtools
  - deeptools=3.5.1
  # deeptools 3.5.1 imports matplotlib.cm.register_cmap, removed in
  # matplotlib 3.9 (WSL real-run finding 2026-09-09); pin below 3.9
  - matplotlib<3.9
  - ucsc-bedclip
  - ucsc-bedgraphtobigwig
  # SPP NSC/RSC
  - phantompeakqualtools=1.2.2
  - r-base=4.3
  # bioconductor builds unpinned: exact 1.38.0/1.54.0 left the current
  # repodata; they solve against the R 4.3 line (1.38 landed as of 2026-09-09)
  - bioconductor-chipseeker
  - bioconductor-genomicfeatures
  # Differential binding (optional stage, diffbind.enabled; pulls DESeq2 and
  # edgeR transitively — unpinned on purpose, solved against the R 4.3 line
  # the same way srna-seq ships bioconductor-deseq2 for its DE stage)
  - bioconductor-diffbind

# R packages note: ChIPseeker/GenomicFeatures are included as conda builds.
# When reusing the server's existing R libraries instead, point r.lib_paths at
# them in config/software.yaml; installing the bioconductor-* entries here is
# then unnecessary.
#
# Deliberately NOT in this template (external installs, see config/software.yaml
# paths:): idr (python2; peak.replicate stage), HOMER (motif stage; its genome
# data installs via configureHomer), TOBIAS (footprint stage; separate
# environment, e.g. conda create -n chip-tobias -c bioconda tobias), and SEACR
# (alternative pooled caller; a bash script from https://github.com/FredHutch/SEACR).
