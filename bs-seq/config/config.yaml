## =====================================================================
## bs-seq workflow main configuration (repository defaults)
## Usage: copy this file into the project working directory, edit it, then run
##   bash run.sh <project_dir> /path/to/config.yaml [jobs]
##   (run.sh injects the configuration into workflow/Snakefile via the BSSEQ_CONFIG env var)
## Within the repo this file doubles as the default configuration, used by --lint
## and the in-repo examples;
## reference paths not set here fall back to the current species' presets in config/species.yaml.
## =====================================================================

## ---- Outputs and samples ----
SampleListFile: "config/samples.csv"   # sample table (sample_id column, optional group/batch for dmr; relative to the working directory)
results_dir: "results"          # run outputs root directory (relative to the working directory)
threads: 12                     # Legacy/default thread cap; explicit resources.<rule>.threads can override

## ---- Per-rule scheduler resources ----
# Scheduler requests (threads / mem_mb / runtime_min per rule) live in the
# dedicated config/resources.yaml; copy it into the working directory as
# resources.yaml to override (run.sh picks it up automatically).

## ---- Species and reference resources ----
## After choosing a species, a reference genome path not explicitly given here
## falls back to the config/species.yaml preset; uncomment and fill in a real
## path to override (takes priority over species.yaml)
species: "osa"                  # currently supported: osa, hsa
# genome: "/path/to/reference/osa/genome.fa"   # plain fasta path (empty/absent = species preset fallback)

## ---- Adapter trimming (Trim Galore) ----
trim:
  enabled: true                 # false = align the raw reads directly (legacy behavior)
  quality: 20                   # 3' quality-trimming cutoff (-q)
  min_len: 20                   # discard trimmed reads shorter than this (--length)
  adapter: "AGATCGGAAGAGC"      # adapter sequence (-a / -A in paired-end mode)
  stringency: 3                 # adapter overlap required to trigger trimming (--stringency)
  error_rate: 0.1               # fraction of mismatches allowed in an adapter match (-e)
  extra: ""                     # extra trim_galore arguments appended verbatim

## ---- Bismark alignment ----
bismark:
  align_extra: "--phred33-quals"   # extra bismark arguments appended verbatim

## ---- Methylation extraction (bismark_methylation_extractor) ----
methylation_extractor:
  cx_report: false              # true = also write the full CX-context cytosine report (large)
  merge_cpg: true               # coverage2cytosine --merge_CpG per sample
  buffer_frac: 4                # extractor --buffer_size = mem_mb / buffer_frac (in GB)

## ---- Differential methylation (methylKit, default off) ----
## Consumes the merged CpG tables (requires methylation_extractor.merge_cpg: true)
## and a group design in the sample table (header sample_id,group[,batch]);
## every contrast is treat-vs-control_group and every group needs >= 2 replicates.
dmr:
  enabled: false                # true = call DMCs/DMRs into 6.DMR/ (single methylKit job)
  control_group: "control"      # sample-table group used as the reference in every contrast
  qvalue: 0.01                  # getMethylDiff qvalue cutoff (SLIM adjusted)
  min_diff: 25                  # minimum percent methylation difference (treatment - control)
  tile_len: 1000                # DMR tiling window size (bp)
  tile_step: 100                # DMR tiling step (bp)
  min_cpg: 3                    # minimum covered CpGs per tile (cov.bases)
  batch_correction: "F"         # "T" = include the sample-table batch column as a covariate (requires batch)
  min_cov: 10                   # minimum per-site coverage (read-time mincov + filterByCoverage lo.count)
  max_cov: 500                  # absolute per-site coverage ceiling (filterByCoverage hi.count)

## Software executables, Conda runtime, and large tool databases
## are configured separately in config/software.yaml (or project software.yaml).
