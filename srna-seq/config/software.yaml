# Unified software/runtime configuration.
# Copy this file to a project as software.yaml and override only what differs.

environment:
  type: system                  # system | conda
  conda_prefix: ""              # preferred for HPC, e.g. /share/conda/envs/srna-seq
  conda_name: ""                # alternative to conda_prefix
  strict: true

# R runtime for the optional differential-expression stage (deg,
# workflow/scripts/run_deseq2.R). Same shape as the rna-seq r: section;
# rscript is the command name or absolute executable path (exported to the
# workflow as SRNA_RSCRIPT when the launcher resolves it).
r:
  rscript: "Rscript"            # command name or absolute executable path
  version: ""                   # optional, e.g. "4.3" or "4.3.3"
  version_check: major_minor    # major_minor | exact | warn | off
  lib_paths: []                 # optional R library directories
  lib_mode: prepend             # prepend | append | replace
  package_sources: {}           # optional package -> local tarball, used for install hints only

# Ordinary tools are resolved from the main environment/PATH automatically
# (bowtie / bowtie-build / trim_galore / fastqc / multiqc / python3).
# Add only overrides that differ from the environment.
tools: {}

# Paths that are not ordinary PATH executables.
paths: {}

databases: {}
