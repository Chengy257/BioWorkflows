# Optional all-in-one environment template for a new server.
# This file is NOT created automatically by Snakemake.
# Example: mamba env create -f workflow/environment.yaml
name: srna-seq
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.10
  - pyyaml
  - snakemake-minimal=7.32.4
  - bowtie=1.3.1
  - trim-galore=0.6.10
  - fastqc=0.11.9
  - multiqc=1.21
  # R runtime for the optional differential-expression stage (deg /
  # DESeq2); needed only when deg.enabled is true in the project config.
  - r-base=4.3
  - bioconductor-deseq2
  - bioconductor-biocparallel
  - r-getopt
  - r-ggplot2
  - r-gplots
  - r-amap
  - r-rcolorbrewer
