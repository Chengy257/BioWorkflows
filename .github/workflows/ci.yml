name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rna-seq:
    name: rna-seq (lint + deg end-to-end regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
        working-directory: rna-seq
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-update-conda: true
          activate-environment: rna-seq
          environment-file: rna-seq/workflow/environment.yaml
          channels: conda-forge,bioconda
          channel-priority: strict
      - name: Install lint tools
        # aPEAR comes from the Conda environment (bioconductor-aPEAR); do not
        # pip-install snakemake here — the environment already provides the
        # pinned snakemake-minimal 7.32.4 and a newer pip Snakemake would
        # shadow it.
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck graphviz
      - name: Runtime resolver tests
        run: bash tests/test_runtime_config.sh
      - name: Lint
        run: bash tests/lint.sh
      - name: Regression test (deg, synthetic data)
        run: bash tests/run_test.sh --pipeline deg --reads 20000
      - name: Upload DAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rna-seq-dag
          path: rna-seq/docs/dag_*.svg
          if-no-files-found: ignore

  chip-cuttag-atac-faire:
    name: chip_cuttag_atac_faire (unit tests + lint + dry-run regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chip_cuttag_atac_faire
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          # pulp<2.8: snakemake 7.32.4 still calls pulp.list_solvers, which
          # pulp 2.8+ removed (renamed to listSolvers).
          pip install "snakemake==7.32.4" "pulp==2.7.0" pyyaml
      - name: Unit tests
        run: python tests/run_tests.py
      - name: Lint
        run: bash tests/lint.sh
      - name: Dry-run regression (synthetic data)
        run: bash tests/run_test.sh --reads 2000
      - name: Replicate/IDR scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --replicate
      - name: Extended QC scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --qc-full
      - name: Motif scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --motif
      - name: DiffBind scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --diffbind
      - name: QC gates scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --gates
      - name: Spike-in scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --spike-in
      - name: SEACR caller scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --seacr
      - name: Footprint scenario dry-run
        run: bash tests/run_test.sh --reads 2000 --footprint

  seclip-seq:
    name: seclip-seq (unit tests + lint + dry-run regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
        working-directory: seclip-seq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install snakemake and lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake==7.32.4" "pulp==2.7.0" pyyaml pytest
          sudo apt-get update
          sudo apt-get install -y shellcheck graphviz
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Lint
        run: bash tests/lint.sh
      - name: Dry-run regression (synthetic data)
        run: bash tests/run_test.sh --reads 2000
      - name: Enabled-stage dry-run regression (v0.2 scenarios)
        run: bash tests/run_test.sh --reads 2000 --consensus
      - name: Upload DAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seclip-seq-dag
          path: seclip-seq/docs/dag_test.svg
          if-no-files-found: ignore

  srna-seq:
    name: srna-seq (unit tests + lint + dry-run regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
        working-directory: srna-seq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install snakemake and lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake==7.32.4" "pulp==2.7.0" pyyaml pytest
          sudo apt-get update
          sudo apt-get install -y shellcheck graphviz
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Lint
        run: bash tests/lint.sh
      - name: Dry-run regression (synthetic data)
        run: bash tests/run_test.sh --reads 2000
      - name: Enabled-stage dry-run regression (v0.2 scenarios)
        run: |
          bash tests/run_test.sh --reads 2000 --deg
          bash tests/run_test.sh --reads 2000 --novel-mirna
      - name: Upload DAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: srna-seq-dag
          path: srna-seq/docs/dag_test.svg
          if-no-files-found: ignore

  bs-seq:
    name: bs-seq (unit tests + lint + dry-run regression)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
        working-directory: bs-seq
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install snakemake and lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake==7.32.4" "pulp==2.7.0" pyyaml pytest
          sudo apt-get update
          sudo apt-get install -y shellcheck graphviz
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Lint
        run: bash tests/lint.sh
      - name: Dry-run regression (synthetic data)
        run: bash tests/run_test.sh --reads 2000
      - name: Enabled-stage dry-run regression (v0.2 scenarios)
        run: bash tests/run_test.sh --reads 2000 --dmr
      - name: Upload DAG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bs-seq-dag
          path: bs-seq/docs/dag_test.svg
          if-no-files-found: ignore

  nextflow-static:
    name: nextflow (static checks)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install tools
        run: |
          curl -fsSL https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          pip install pyyaml
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Nextflow config syntax validation (chipseq-ext)
        run: |
          cd nextflow/pipelines/chipseq-ext
          nextflow config -flat -profile test > /dev/null
          nextflow config -flat -profile test_full > /dev/null
      - name: YAML validation (adopted params example, versions)
        run: python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in ['nextflow/versions.yml','nextflow/adopted/chipseq/params.example.yaml']]"
      - name: Shell lint (launchers)
        run: shellcheck nextflow/adopted/chipseq/run-chipseq.sh nextflow/pipelines/chipseq-ext/tests/make_fixtures.sh
      - name: Extension scripts compile
        run: |
          python -m py_compile \
            nextflow/pipelines/chipseq-ext/modules/local/*/bin/*.py
