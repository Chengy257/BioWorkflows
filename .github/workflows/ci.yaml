name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖（snakemake / pyyaml / shellcheck）
        run: |
          python -m pip install --upgrade pip
          pip install "snakemake>=8,<9" pyyaml

      - name: 单元测试 + shell/yaml 语法检查
        run: make check PYTHON=python

      - name: shellcheck 静态检查
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck run.sh workflow/scripts/*.sh scripts/*.sh

      - name: snakemake --lint
        run: make lint SNAKEMAKE="snakemake"

      - name: snakemake 解析冒烟（--list-rules）
        run: |
          snakemake -s workflow/Snakefile --configfile config/config.yaml --list-rules
