# Optional all-in-one environment template for a new server.
# This file is NOT created automatically by Snakemake.
# Example: mamba env create -f workflow/environment.yaml
name: seclip-seq
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # python 3.9, not 3.10: the umi-tools sdist bootstraps setuptools 10.0
  # (2015) in its setup.py, which cannot build under python >= 3.10; on 3.9
  # `pip install umi-tools==1.1.5` works (validated 2026-09-05).
  - python=3.9
  - pyyaml
  - snakemake-minimal=7.32.4
  - star=2.7.10b
  - samtools=1.17
  - bedtools=2.31.0  # cross-sample consensus (multiinter) and peak annotation
                     # (intersect/closest); used by the optional v0.2 stages
  - cutadapt=4.6
  - pip
  - pip:
      # umi-tools was removed from bioconda (package page 404; only the
      # Rust rewrite umi-tools-rs remains there). The PyPI wheel keeps the
      # exact `umi_tools` CLI this workflow invokes; see CHANGELOG.md
      # (2026-09-05 environment solve validation).
      - umi-tools==1.1.5
  - seqkit=2.13.0  # name sort in rule fastq_sort; replaces ea-utils
                # fastq-sort — the current bioconda ea-utils build ships
                # no fastq-sort binary (see docs/TODO.md section 4).
  - fastqc=0.11.9
  - multiqc=1.21
  - pureclip=1.3.1
