## =====================================================================
## Example project configuration (copy into your project directory, then edit)
## Run: bash run.sh deg <project_dir> <project_dir>/config.yaml 10
## =====================================================================

pipeline: "deg"                 # upstream | deg | as | lncrna
results_dir: "results"
SampleListFile: "samples_231107XTL.csv"   # the example uses a real project sample table (27 samples, see this directory)
control_group: "control"
threads: 12

FoldChange: "2"
padj: "0.05"
pca_ntop: 20000
batch_correction: "F"           # DESeq2 batch correction (when T the sample table needs a third "batch" column; F disables it)

## Reference resources (must be replaced with real cluster paths before running;
## they can also be commented out to fall back to the config/species.yaml presets)
species: "osa"
bed: "/path/to/reference/osa/Oryza_sativa.IRGSP-1.0.56.Chr.bed"
genome: "/path/to/reference/osa/genome.fa"
gtf: "/path/to/reference/osa/annotation.gtf"
annotation_tsv: "/path/to/reference/osa/annotation_full.tsv"

star_extra_args: ""

## Adapter trimming (Trim Galore); defaults reproduce the historical hardcoded command
trim:
  quality: 30
  stringency: 3
  error_rate: 0.1
  extra: ""

## Optional UMI 5' clipping inside STAR (--clip5pNbases); 8bp random UMI +
## fixed T anchor at position 9 -> read1_len: 9, read2_len: 9. No deduplication.
umi:
  enabled: false
  read1_len: 0
  read2_len: 0

lncrna:
  gtf: ""
  gtf_PcGs: "/path/to/reference/osa/MSU_RAP_combined_CDS_PcGs.gtf"
  threads: 30
