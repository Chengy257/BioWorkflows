## =====================================================================
## rna-seq configuration template -- copy into a project directory and edit as
## needed (or copy as config.local.yaml in the working directory; run.sh layers
## it automatically, and such local files are typically kept out of version control)
## Keys not listed here inherit the repo defaults from config/config.yaml;
## species presets are in config/species.yaml.
## =====================================================================

## ---- Run mode (injected automatically by run.sh; usually no need to change here)----
pipeline: "upstream"            # upstream | deg | as | lncrna

## ---- Outputs and samples ----
results_dir: "results"          # run outputs root directory (relative to the run directory)
SampleListFile: "config/samples.csv"   # sample table (relative to the run directory; usually "samples.csv" inside a project)
control_group: "control"        # control group name
threads: 12                     # Legacy/default thread cap; explicit resources.<rule>.threads can override

## ---- Per-rule scheduler resources ----
# Scheduler requests (threads / mem_mb / runtime_min per rule) now live in the
# dedicated config/resources.yaml; copy it into the project directory as
# resources.yaml to override (run.sh picks it up automatically).

## ---- Differential analysis ----
FoldChange: "2"                 # fold-change threshold (|log2FC| > 1)
padj: "0.05"                    # adjusted p-value threshold
pca_ntop: 20000                 # number of variable genes used for PCA
batch_correction: "F"           # DESeq2 batch correction (when T the sample table needs a third "batch" column; F disables it)

## ---- Species and reference resources ----
## After choosing a species, resource keys not explicitly given here fall back to the
## config/species.yaml presets; uncomment and fill in real paths to override (takes priority over species.yaml)
species: "osa"                  # osa | hsa
# bed: "/path/to/reference/osa/Oryza_sativa.IRGSP-1.0.56.Chr.bed"
# genome: "/path/to/reference/osa/genome.fa"
# gtf: "/path/to/reference/osa/annotation.gtf"
# annotation_tsv: "/path/to/reference/osa/annotation_full.tsv"

## ---- STAR ----
star_extra_args: ""             # extra STAR arguments (the assembly pipeline defaults to assembly-optimized parameters, see workflow/rules/common.smk)

## ---- Adapter trimming (Trim Galore) ----
## Optional; the values below reproduce the historical hardcoded command, so
## the whole section can also be deleted without changing behavior.
trim:
  quality: 30                   # -q: terminal low-quality base cutoff
  stringency: 3                 # --stringency: minimum adapter overlap (bp)
  error_rate: 0.1               # -e: maximum adapter mismatch rate
  extra: ""                     # extra Trim Galore/cutadapt arguments, e.g. "--length 20"

## ---- UMI 5' clipping (optional, applied inside STAR) ----
## With enabled: true and read1_len > 0, per-sample STAR commands gain
## --clip5pNbases (PE: "9,9" -- two comma-separated values are required by
## STAR 2.7.10b; SE: a single value). Data basis of the verified UMI libraries:
## 8bp random UMI + a fixed T anchor at position 9 -> read1_len: 9, read2_len: 9.
## Clipping only; no deduplication. Conflicts with --clip5pNbases in
## star_extra_args fail validation.
# umi:
#   enabled: false
#   read1_len: 0
#   read2_len: 0

## Software executables, Conda runtime, Rscript/R libraries, and large tool databases
## are configured separately in config/software.yaml (or project software.yaml).

## ---- lncRNA pipeline (only used when pipeline=lncrna)----
lncrna:
  gtf: ""                       # lncRNA pipeline reference annotation; leave empty to use the top-level gtf
  gtf_PcGs: "/path/to/reference/osa/MSU_RAP_combined_CDS_PcGs.gtf"
  threads: 30                   # threads for Pfam / NR searches
