## =====================================================================
## rna-seq 工作流主配置（项目级配置模板）
## 用法：复制本文件到项目目录修改，然后
##   bash run.sh <pipeline> <project_dir> /path/to/config.yaml [jobs]
##   （run.sh 经 RNASEQ_CONFIG 环境变量将配置注入 workflow/Snakefile）
## 仓库内本文件同时是默认配置，供 --lint 与仓库内示例使用；
## 注释掉的键回落到 config/species.yaml 中当前物种的预设。
## =====================================================================

## ---- 运行模式（run.sh 自动注入，一般无需在此修改）----
pipeline: "upstream"            # upstream | deg | as | lncrna

## ---- 输出与样本 ----
results_dir: "results"          # 运行产物根目录（相对运行目录）
SampleListFile: "config/samples.csv"   # 样本表（相对运行目录；项目内通常为 "samples.csv"）
control_group: "control"        # 对照组组名
threads: 12                     # Legacy/default thread cap; explicit resources.<rule>.threads can override

## ---- Per-rule scheduler resources ----
## Memory is MB; runtime_min is walltime in minutes. Older project configs may
## omit this section and will use the same built-in defaults. Add a "threads"
## key to any rule below when a rule-specific CPU override is needed.
resources:
  trim: {mem_mb: 8000, runtime_min: 180}
  multiqc: {mem_mb: 4000, runtime_min: 60}
  star_index: {mem_mb: 48000, runtime_min: 480}
  star_align: {mem_mb: 32000, runtime_min: 360}
  mapping_stat: {mem_mb: 2000, runtime_min: 30}
  strandedness: {mem_mb: 4000, runtime_min: 60}
  featurecounts: {mem_mb: 16000, runtime_min: 240}
  count_merge: {mem_mb: 4000, runtime_min: 60}
  deseq2: {mem_mb: 16000, runtime_min: 240}
  enrichment: {mem_mb: 12000, runtime_min: 360}
  deg_compare: {mem_mb: 12000, runtime_min: 360}
  stringtie: {mem_mb: 16000, runtime_min: 360}
  gtf_merge: {mem_mb: 12000, runtime_min: 240}
  isoform_expr: {mem_mb: 16000, runtime_min: 360}
  lnc_coding: {mem_mb: 16000, runtime_min: 720}
  pfam: {mem_mb: 24000, runtime_min: 720}
  nr: {mem_mb: 32000, runtime_min: 1440}
  lnc_final: {mem_mb: 8000, runtime_min: 120}
  lnc_featurecounts: {mem_mb: 16000, runtime_min: 240}
  lnc_count_merge: {mem_mb: 4000, runtime_min: 60}

## ---- 差异分析 ----
FoldChange: "2"                 # 倍数阈值（|log2FC| > 1）
padj: "0.05"                    # 校正 p 值阈值
pca_ntop: 20000                 # PCA 使用的变异基因数
batch_correction: "F"           # DESeq2 批次校正（T 时样本表需含第三列 batch；F 关闭）

## ---- 物种与参考资源 ----
## 选定 species 后，未在此显式给出的资源键回落到 config/species.yaml 预设；
## 需要覆盖时取消注释并填写真实路径（优先于 species.yaml）
species: "osa"                  # osa | hsa
# bed: "/path/to/reference/osa/Oryza_sativa.IRGSP-1.0.56.Chr.bed"
# genome: "/path/to/reference/osa/genome.fa"
# gtf: "/path/to/reference/osa/annotation.gtf"
# annotation_tsv: "/path/to/reference/osa/annotation_full.tsv"

## ---- STAR ----
star_extra_args: ""             # 追加的 STAR 参数（组装管线默认使用组装优化参数，见 workflow/rules/common.smk）

## Software executables, Conda runtime, Rscript/R libraries, and large tool databases
## are configured separately in config/software.yaml (or project software.yaml).

## ---- lncRNA 管线（仅 pipeline=lncrna 使用）----
lncrna:
  gtf: ""                       # lncRNA 流程参考注释；留空使用顶层 gtf
  gtf_PcGs: "/path/to/reference/osa/MSU_RAP_combined_CDS_PcGs.gtf"
  threads: 30                   # Pfam / NR 搜索线程
