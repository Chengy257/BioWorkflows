## =====================================================================
## Species resource preset map (loaded by workflow/Snakefile)
## The top-level species key selects one entry; resource keys only take
## effect when the project configuration does not set them explicitly.
## Paths are placeholders; override them with real cluster paths in the
## project configuration at deployment time.
## =====================================================================

osa:
  label: "Rice Oryza sativa (IRGSP-1.0 / RAP-DB)"
  kegg_organism: "dosa"          # KEGG organism code (rice japonica)
  bed: "/path/to/reference/osa/Oryza_sativa.IRGSP-1.0.56.Chr.bed"        # used by RSeQC infer_experiment
  genome: "/path/to/reference/osa/genome.fa"
  gtf: "/path/to/reference/osa/annotation.gtf"
  annotation_tsv: "/path/to/reference/osa/annotation_full.tsv"           # functional annotation table keyed by gene id

hsa:
  label: "Human Homo sapiens (GRCh38 / GENCODE)"
  kegg_organism: "hsa"
  bed: "/path/to/reference/hsa/genes.bed"
  genome: "/path/to/reference/hsa/GRCh38.p14.genome.fa"
  gtf: "/path/to/reference/hsa/gencode.v44.annotation.gtf"
  annotation_tsv: "/path/to/reference/hsa/annotation_full.tsv"
