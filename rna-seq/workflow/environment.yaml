# Optional all-in-one environment template for a new server.
# This file is NOT created automatically by Snakemake.
# Example: mamba env create -f workflow/environment.yaml
name: rna-seq
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  # Python 3.10, not 3.11+: rseqc=5.0.1 only ships builds for <=3.10, and the
  # exact pins below must stay co-installable (validated by a dry-run solve).
  - python=3.10
  - git
  - pyyaml
  - snakemake-minimal=7.32.4
  - fastqc=0.11.9
  - trim-galore=0.6.10
  - multiqc=1.21
  - star=2.7.10b
  - samtools=1.17
  - rseqc=5.0.1
  - stringtie=2.2.1
  - gffcompare=0.12.6
  - gffread=0.12.7
  - bioawk=1.0
  - diamond=2.1.8
  - hmmer=3.3.2
  - bedtools=2.30.0
  # R 4.3 series: bioconductor-aPEAR (required by the deg pipeline) entered
  # Bioconductor at 3.17 / R 4.3, so this series is the minimum that carries
  # every Bioconductor dependency; the solver picks coherent builds.
  - r-base=4.3
  - bioconductor-rsubread
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-deseq2
  - bioconductor-biocparallel
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-aPEAR
  - bioconductor-org.hs.eg.db
  - r-argparser
  - r-getopt
  - r-ggplot2
  - r-gplots
  - r-amap
  - r-rcolorbrewer
  - r-svglite
  - r-magrittr
  - r-dplyr
  - r-venndiagram
  - r-upsetr
  - r-r.utils
