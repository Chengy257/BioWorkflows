# Optional all-in-one environment template for a new server.
# This file is NOT created automatically by Snakemake.
# Example: mamba env create -f workflow/environment.yaml
name: rna-seq
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - git
  - pyyaml
  - snakemake-minimal=7.32.4
  - fastqc=0.11.9
  - trim-galore=0.6.10
  - multiqc=1.21
  - star=2.7.10b
  - samtools=1.17
  - rseqc=5.0.1
  - stringtie=2.2.1
  - gffcompare=0.12.6
  - gffread=0.12.7
  - bioawk=1.0
  - diamond=2.1.8
  - hmmer=3.3.2
  - bedtools=2.30.0
  - r-base=4.2.3
  - bioconductor-rsubread
  - bioconductor-edger
  - bioconductor-limma
  - bioconductor-deseq2
  - bioconductor-biocparallel
  - bioconductor-clusterprofiler
  - bioconductor-enrichplot
  - bioconductor-org.hs.eg.db
  - r-argparser
  - r-getopt
  - r-ggplot2
  - r-gplots
  - r-amap
  - r-rcolorbrewer
  - r-svglite
  - r-magrittr
  - r-dplyr
  - r-venndiagram
  - r-upsetr
  - r-r.utils

# aPEAR is installed once after environment creation:
# Rscript -e 'install.packages("aPEAR", repos="https://cloud.r-project.org")'
