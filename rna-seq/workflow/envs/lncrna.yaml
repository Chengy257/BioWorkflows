## lncRNA de novo 鉴定环境 —— rules(RNA-seq_lncRNA_DenovoIdenti): 全部
## 注意：CPC2 / CNCI / pfam_scan.pl 为外部工具，不经 conda 安装，
##       路径见 config_lncRNA.yaml（cpc2_bin / cnci_dir），pfam_scan.pl 需在 PATH 中
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - stringtie=2.2.1
  - gffcompare=0.12.6
  - gffread=0.12.7
  - bioawk=1.0
  - diamond=2.1.8
  - hmmer=3.3.2
  - bedtools=2.30.0
